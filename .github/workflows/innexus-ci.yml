name: InnovationNexus CI

# Fork of gitroomhq/postiz-app pinned to a release tag plus the patches listed
# in INNEXUS.md. Upstream workflows are removed on this branch on purpose: they
# push to gitroomhq's registry and run schedules this fork has no use for.

on:
  pull_request:
    branches: [innexus/main]
  push:
    branches: [innexus/main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/innovationnexus/postiz-app
  UPSTREAM_TAG: v2.25.3

jobs:
  unit-tests:
    name: Unit tests (fork patches)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run fork patch tests
        timeout-minutes: 5
        # The spec file is import-free apart from vitest, so run vitest standalone
        # from a throwaway prefix instead of installing the whole pnpm workspace.
        run: |
          npm install --prefix "$RUNNER_TEMP/vt" --no-save --no-package-lock --no-fund --no-audit vitest@4.1.12
          "$RUNNER_TEMP/vt/node_modules/.bin/vitest" run --root "$GITHUB_WORKSPACE" \
            --dir libraries/nestjs-libraries/src/integrations/social \
            linkedin.innexus.spec.ts

  build-image:
    name: Production build (image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push on innexus/main)
        timeout-minutes: 55
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_VERSION=${{ env.UPSTREAM_TAG }}-innexus
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/InnovationNexus/postiz-app
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [unit-tests, build-image]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
          || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
          || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required CI job did not succeed."
            exit 1
          fi
          echo "All required CI jobs passed."
